name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  test:
    uses: ./.github/workflows/test.yml

  create-release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      pull-requests: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
    
    - name: Generate changelog
      id: changelog
      run: |
        RELEASE_VERSION="${{ steps.get_version.outputs.version }}"
        CHANGELOG_VERSION="${RELEASE_VERSION#v}"
        if [ -f CHANGELOG.md ]; then
          # Extract changelog for this version
          sed -n "/## \[${CHANGELOG_VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
        fi
        if [ ! -s release_notes.md ]; then
          echo "## Changes in ${RELEASE_VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "See CHANGELOG.md and commit history for detailed changes." >> release_notes.md
        fi
    
    - name: Create source distribution
      run: |
        python -m build --sdist
    
    - name: Create release archive
      run: |
        # Create a clean source archive for the desktop version
        mkdir -p release-assets
        
        # Create webapp-only archive (for desktop integration)
        tar -czf release-assets/docuscope-ca-webapp-${{ steps.get_version.outputs.version }}.tar.gz \
          webapp/ \
          requirements.txt \
          pyproject.toml \
          README.md \
          LICENSE \
          CHANGELOG.md \
          CONTRIBUTING.md
        
        # Create full source archive
        tar -czf release-assets/docuscope-ca-online-${{ steps.get_version.outputs.version }}.tar.gz \
          --exclude='.git*' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='.pytest_cache' \
          --exclude='dist' \
          --exclude='build' \
          --exclude='release-assets' \
          .
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        body_path: release_notes.md
        files: |
          release-assets/*.tar.gz
          dist/*.tar.gz
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Notify template users (if configured)
      if: vars.TEMPLATE_NOTIFICATION_ENABLED == 'true'
      run: |
        echo "🎉 New release ${{ steps.get_version.outputs.version }} available!"
        echo "Template users with automatic sync will receive PRs with updates."
        echo "Manual sync users can update using:"
        echo "git remote add upstream https://github.com/${{ github.repository }}"
        echo "git fetch upstream && git merge upstream/main"

events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $cookie_docuscope_affinity $docuscope_affinity {
        default $cookie_docuscope_affinity;
        '' $request_id;
    }

    upstream streamlit_backend {
        zone streamlit_backend 64k;
        hash $docuscope_affinity consistent;
        server streamlit_app:8501 resolve;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 200m;
        add_header Set-Cookie "docuscope_affinity=$docuscope_affinity; Path=/; HttpOnly; SameSite=Lax" always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://streamlit_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}

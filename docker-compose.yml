# Docker Compose v2 format (implicit version). The top-level `version` key is deprecated in v2 and intentionally omitted.
# Tip: For local development with hot-reloading, mount the project and override the command (see commented lines below).
services:
  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    # For development with hot-reloading, uncomment the next two lines:
    # volumes:
    #   - ./:/app
    # command overrides Dockerfile CMD for dev; for prod, let Dockerfile CMD run
    # command: streamlit run webapp/index.py --server.port 8501 --server.address 0.0.0.0
# Docker Compose v2 format (implicit version). The top-level `version` key is deprecated in v2 and intentionally omitted.
# Tip: For local development with hot-reloading, mount the project and override the command (see commented lines below).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docuscope_ca}
      POSTGRES_USER: ${POSTGRES_USER:-docuscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docuscope}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docuscope}:${POSTGRES_PASSWORD:-docuscope}@postgres:5432/${POSTGRES_DB:-docuscope_ca}
    command: alembic upgrade head

  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docuscope}:${POSTGRES_PASSWORD:-docuscope}@postgres:5432/${POSTGRES_DB:-docuscope_ca}
      REDIS_URL: redis://redis:6379/0
      DOCUSCOPE_RQ_ENABLED: "1"
      DOCUSCOPE_RQ_SIMPLE_WORKER: "1"
      DOCUSCOPE_RQ_PLOTBOT_QUEUE: ${DOCUSCOPE_RQ_PLOTBOT_QUEUE:-docuscope-plotbot}
      DOCUSCOPE_AI_PROVIDER: ${DOCUSCOPE_AI_PROVIDER:-}
      DOCUSCOPE_AI_BASE_URL: ${DOCUSCOPE_AI_BASE_URL:-}
      DOCUSCOPE_AI_MODEL: ${DOCUSCOPE_AI_MODEL:-}
      DOCUSCOPE_AI_API_KEY: ${DOCUSCOPE_AI_API_KEY:-}
      DOCUSCOPE_AI_TIMEOUT_SECONDS: ${DOCUSCOPE_AI_TIMEOUT_SECONDS:-60}
    ports:
      - "8501:8501"
    volumes:
      - artifact_data:/app/webapp/_artifacts
    command:
      - streamlit
      - run
      - webapp/index.py
      - --server.port
      - "8501"
      - --server.address
      - 0.0.0.0
      - --server.fileWatcherType
      - none
    # For development with hot-reloading, uncomment the next two lines:
    # volumes:
    #   - ./:/app
    # command overrides Dockerfile CMD for dev; for prod, let Dockerfile CMD run
    # command: streamlit run webapp/index.py --server.port 8501 --server.address 0.0.0.0

  rq_worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docuscope}:${POSTGRES_PASSWORD:-docuscope}@postgres:5432/${POSTGRES_DB:-docuscope_ca}
      REDIS_URL: redis://redis:6379/0
      DOCUSCOPE_RQ_ENABLED: "1"
      DOCUSCOPE_RQ_SIMPLE_WORKER: "0"
    volumes:
      - artifact_data:/app/webapp/_artifacts
    command: python -m webapp.queue.worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "webapp.queue.worker", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  rq_plotbot_worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docuscope}:${POSTGRES_PASSWORD:-docuscope}@postgres:5432/${POSTGRES_DB:-docuscope_ca}
      REDIS_URL: redis://redis:6379/0
      DOCUSCOPE_RQ_ENABLED: "1"
      DOCUSCOPE_RQ_QUEUE: ${DOCUSCOPE_RQ_PLOTBOT_QUEUE:-docuscope-plotbot}
      DOCUSCOPE_RQ_PLOTBOT_QUEUE: ${DOCUSCOPE_RQ_PLOTBOT_QUEUE:-docuscope-plotbot}
      DOCUSCOPE_RQ_SIMPLE_WORKER: "0"
      DOCUSCOPE_AI_PROVIDER: ${DOCUSCOPE_AI_PROVIDER:-}
      DOCUSCOPE_AI_BASE_URL: ${DOCUSCOPE_AI_BASE_URL:-}
      DOCUSCOPE_AI_MODEL: ${DOCUSCOPE_AI_MODEL:-}
      DOCUSCOPE_AI_API_KEY: ${DOCUSCOPE_AI_API_KEY:-}
      DOCUSCOPE_AI_TIMEOUT_SECONDS: ${DOCUSCOPE_AI_TIMEOUT_SECONDS:-60}
    command: python -m webapp.queue.worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "webapp.queue.worker", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docuscope}:${POSTGRES_PASSWORD:-docuscope}@postgres:5432/${POSTGRES_DB:-docuscope_ca}
      DOCUSCOPE_ARTIFACT_STORE_ROOT: /app/webapp/_artifacts
      DOCUSCOPE_CLEANUP_INTERVAL_SECONDS: ${DOCUSCOPE_CLEANUP_INTERVAL_SECONDS:-3600}
      DOCUSCOPE_PRIVATE_ARTIFACT_TTL_HOURS: ${DOCUSCOPE_PRIVATE_ARTIFACT_TTL_HOURS:-24}
      DOCUSCOPE_TERMINAL_JOB_RETENTION_DAYS: ${DOCUSCOPE_TERMINAL_JOB_RETENTION_DAYS:-7}
      DOCUSCOPE_ACCESS_LOG_RETENTION_DAYS: ${DOCUSCOPE_ACCESS_LOG_RETENTION_DAYS:-30}
      DOCUSCOPE_CONFIG_AUDIT_RETENTION_DAYS: ${DOCUSCOPE_CONFIG_AUDIT_RETENTION_DAYS:-90}
    volumes:
      - artifact_data:/app/webapp/_artifacts
    command: python -m webapp.persistence.cleanup
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  postgres_data:
  artifact_data:
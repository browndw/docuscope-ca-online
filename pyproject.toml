[project]
name = "docuscope-ca-online"
version = "0.5.0"
description = "An online version of the Docuscope CA tool for analyzing text."
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = ["nlp", "language"]
authors = [
    { name = "David Brown", email = "dwb2@andrew.cmu.edu" }
]
maintainers = [
    { name = "David Brown", email = "dwb2@andrew.cmu.edu" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "Authlib==1.5.2",
    "docuscospacy==0.3.7",
    "google-cloud-firestore==2.20.2",
    "lingua-language-detector==2.0.2",
    "loguru==0.7.3",
    "kaleido==0.2.1",
    "numpy==1.26.4",
    "openai==1.66.5",
    "pandas==2.2.3",
    "plotly==6.0.1",
    "polars==1.42.1",
    "psutil==7.0.0",
    "SQLAlchemy==2.0.41",
    "alembic==1.16.1",
    "psycopg[binary]==3.2.9",
    "redis==5.2.1",
    "rq==1.16.2",
    "python-docx==1.1.2",
    "RestrictedPython==8.0.0",
    "spacy==3.8.14",
    "streamlit==1.58.0",
    "Unidecode==1.3.8",
    "XlsxWriter==3.2.2",
]

[project.urls]
Homepage = "https://github.com/browndw/docuscope-ca-online"
Source = "https://github.com/browndw/docuscope-ca-online"
Documentation = "https://browndw.github.io/docuscope-docs/"
Issues = "https://github.com/browndw/docuscope-ca-online/issues"
Changelog = "https://github.com/browndw/docuscope-ca-online/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=45", "setuptools-scm>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages]
find = { namespaces = false }

[project.scripts]
docuscope-ca = "docuscope_ca.cli:main"
docuscope-rq-smoke = "webapp.queue.smoke_test:main"

[tool.setuptools_scm]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "streamlit: marks tests as streamlit UI tests",
    "slow: marks tests as slow running",
    "ai: marks tests that require AI/LLM access"
]
filterwarnings = [
    "ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning:click.parser",
    "ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning:weasel.util.config",
    # Broad fallback to suppress the same deprecation from any other import path (e.g., spaCy internals)
    "ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=4.0.0"
]
